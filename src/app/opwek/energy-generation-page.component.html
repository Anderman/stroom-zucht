<section class="mb-4 flex flex-wrap gap-2" aria-label="Datakeuze">
  @for (dataset of visibleDatasets; track dataset.key) {
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-none border px-4 py-2 text-sm font-medium transition-all duration-200"
      [class]="dataset.key === viewStore.activeDataset()
        ? 'border-emerald-300 bg-emerald-50 text-emerald-800 dark:border-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300'
        : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400 dark:hover:border-slate-600 dark:hover:bg-slate-800'"
      (click)="viewStore.selectDataset(dataset.key)"
      [attr.aria-pressed]="dataset.key === viewStore.activeDataset()"
    >
      <span class="h-2.5 w-2.5 rounded-full" [style.background]="dataset.color"></span>
      <span>{{ dataset.label }}</span>
    </button>
  }
</section>

@if (presentationStore.totalDemandSummaryItems().length) {
  <section class="mb-6" aria-label="Opwek overzicht">
    <details class="group" open>
      <summary class="cursor-pointer list-none">
        <div class="flex items-center gap-3">
          <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Opwek overzicht</h2>
          <span class="ml-auto text-emerald-600 dark:text-emerald-400 group-open:rotate-180 transition-transform">▼</span>
        </div>
      </summary>
      <div class="mt-4 space-y-3">
        @for (item of presentationStore.totalDemandSummaryItems(); track item.label) {
          <div class="flex items-center gap-4 border-b border-slate-100 py-3 dark:border-slate-800 last:border-0">
            <span class="h-3 w-3 rounded-full" [style.background]="item.color"></span>
            <span class="min-w-[120px] text-sm font-medium text-slate-700 dark:text-slate-300">{{ item.label }}</span>
            <strong class="ml-auto text-lg font-semibold text-slate-900 dark:text-slate-100">{{ item.totalText }}</strong>
            <span class="text-sm text-slate-500 dark:text-slate-400">{{ item.shareText }}</span>
          </div>
        }
      </div>
    </details>
  </section>
}
